<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>WebAR - 다가오는 적 물리치기</title>
    <!-- A-Frame 및 AR.js 로드 -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>

    <style>
      #ui-container {
        position: absolute;
        top: 20px;
        width: 100%;
        text-align: center;
        z-index: 999;
        pointer-events: none;
      }
      .title-box {
        display: inline-block;
        background-color: rgba(0, 0, 0, 0.7);
        color: white;
        padding: 10px 20px;
        border-radius: 8px;
        font-family: sans-serif;
        font-weight: bold;
      }
    </style>

    <script>
      // 1. 적(Enemy)의 행동을 제어하는 컴포넌트
      AFRAME.registerComponent('enemy-behavior', {
        schema: {
          health: { type: 'int', default: 3 }, // 기본 체력 3
          speed: { type: 'number', default: 0.02 } // 이동 속도
        },
        
        init: function () {
          this.cameraEl = document.querySelector('[camera]');
          this.updateAppearance();
          
          // 터치(클릭) 이벤트 리스너: 체력 감소 로직
          this.el.addEventListener('click', () => {
            this.data.health--; // 체력 1 감소
            
            if (this.data.health <= 0) {
              // 체력이 0 이하가 되면 화면에서 제거
              this.el.parentNode.removeChild(this.el);
            } else {
              // 아직 살아있다면 색상 업데이트
              this.updateAppearance();
              // 타격 효과 (잠시 작아졌다 커짐)
              this.el.setAttribute('scale', '0.3 0.3 0.3');
              setTimeout(() => {
                if(this.el) this.el.setAttribute('scale', '0.5 0.5 0.5');
              }, 100);
            }
          });
        },

        // 체력에 따라 색상을 변경하는 함수
        updateAppearance: function () {
          // 체력 3: 빨강, 2: 노랑, 1: 초록
          const colors = ['#000000', '#4CAF50', '#FFEB3B', '#F44336']; 
          this.el.setAttribute('color', colors[this.data.health]);
        },

        // 매 프레임마다 실행되는 함수 (이동 로직)
        tick: function (time, timeDelta) {
          // 1. 현재 적의 위치와 카메라(플레이어)의 위치 가져오기
          const currentPos = this.el.object3D.position;
          const targetPos = this.cameraEl.object3D.position;
          
          // 2. 카메라를 향하는 방향 벡터 계산
          const direction = new THREE.Vector3().subVectors(targetPos, currentPos).normalize();
          
          // 3. 기기 프레임(timeDelta)에 비례하여 이동할 거리 계산 (부드러운 이동)
          const moveDistance = this.data.speed * (timeDelta / 16); 
          
          // 4. 적의 위치 업데이트 (카메라 쪽으로 전진)
          this.el.object3D.position.add(direction.multiplyScalar(moveDistance));
        }
      });

      // 2. 랜덤한 위치에서 적을 계속 생성하는 컴포넌트
      AFRAME.registerComponent('enemy-spawner', {
        init: function () {
          // 2초(2000ms)마다 적 생성 함수 호출
          this.spawnTimer = setInterval(() => this.spawnEnemy(), 2000);
        },
        
        spawnEnemy: function () {
          const scene = document.querySelector('a-scene');
          const enemy = document.createElement('a-box');

          // 카메라 기준 반경 8~12m 밖의 랜덤한 위치 계산
          const radius = 8 + Math.random() * 4; 
          const angle = Math.random() * Math.PI * 2; // 0 ~ 360도 랜덤
          
          const startX = Math.cos(angle) * radius;
          const startZ = Math.sin(angle) * radius;
          const startY = Math.random() * 2; // 높이는 0~2m 사이 랜덤
          
          enemy.setAttribute('position', {x: startX, y: startY, z: startZ});
          enemy.setAttribute('scale', '0.5 0.5 0.5');
          
          // 랜덤 체력 부여 (1~3 사이)
          const randomHealth = Math.floor(Math.random() * 3) + 1;
          
          // enemy-behavior 컴포넌트 추가
          enemy.setAttribute('enemy-behavior', `health: ${randomHealth}`);
          
          scene.appendChild(enemy);
        }
      });
    </script>
  </head>

  <body style="margin: 0; overflow: hidden;">
    
    <!-- UI 영역 -->
    <div id="ui-container">
      <div class="title-box">
        중앙 커서를 맞추고 화면을 터치해<br>다가오는 큐브를 파괴하세요!
      </div>
    </div>

    <!-- AR 씬 설정 -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" enemy-spawner>
      
      <!-- 플레이어 카메라 -->
      <a-entity camera position="0 1.6 0">
        <!-- 조준점(커서) 추가 -->
        <a-cursor color="#FFFFFF" animation__click="property: scale; startEvents: click; easing: easeInCubic; dur: 150; from: 0.1 0.1 0.1; to: 1 1 1"></a-cursor>
      </a-entity>
      
    </a-scene>
  </body>
</html>
