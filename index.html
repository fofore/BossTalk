<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>WebAR 마인크래프트 프로토타입</title>
    <!-- A-Frame 및 AR.js 라이브러리 불러오기 -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <script>
      // 블록을 클릭(터치)하면 새로운 블록을 생성하는 컴포넌트
      AFRAME.registerComponent('voxel-builder', {
        init: function () {
          this.el.addEventListener('click', (evt) => {
            // 클릭된 정확한 좌표(intersection point) 가져오기
            const intersection = evt.detail.intersection;
            if (!intersection) return;

            // 새로운 블록(a-box) 생성
            const newBlock = document.createElement('a-box');
            
            // 블록 크기 및 색상 설정 (마인크래프트 나무 블록 느낌)
            newBlock.setAttribute('width', '0.5');
            newBlock.setAttribute('height', '0.5');
            newBlock.setAttribute('depth', '0.5');
            newBlock.setAttribute('color', '#8B4513'); 
            
            // 방금 터치한 면을 기준으로 새 블록의 위치 계산 (y축으로 쌓아올림)
            const clickPoint = intersection.point;
            const normal = intersection.face.normal;
            
            // 블록 크기의 절반(0.25)만큼 띄워서 배치
            newBlock.setAttribute('position', {
              x: clickPoint.x + (normal.x * 0.25),
              y: clickPoint.y + (normal.y * 0.25),
              z: clickPoint.z + (normal.z * 0.25)
            });

            // 새 블록에도 클릭 이벤트를 부여하여 계속 쌓을 수 있게 함
            newBlock.setAttribute('voxel-builder', '');
            
            // 마커 그룹(scene)에 새 블록 추가
            const markerGroup = document.querySelector('#voxel-group');
            markerGroup.appendChild(newBlock);
          });
        }
      });
    </script>
  </head>

  <!-- 브라우저 여백 제거 및 스크롤 방지 -->
  <body style="margin: 0; overflow: hidden;">
    <!-- AR 씬 설정 (디버그 UI 끄기) -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" cursor="rayOrigin: mouse">
      
      <!-- 'Hiro' 마커를 인식했을 때 나타날 객체들 -->
      <a-marker preset="hiro">
        <!-- 블록들이 담길 그룹 -->
        <a-entity id="voxel-group">
          <!-- 기본으로 생성되어 있는 첫 잔디 블록 -->
          <a-box 
            position="0 0.25 0" 
            width="0.5" height="0.5" depth="0.5" 
            color="#4CAF50" 
            voxel-builder>
          </a-box>
        </a-entity>
      </a-marker>

      <!-- 사용자 카메라 (시점) -->
      <a-entity camera>
        <a-cursor color="yellow"></a-cursor>
      </a-entity>
    </a-scene>
  </body>
</html>
